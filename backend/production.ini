###
# app configuration
###

[app:main]
use = egg:backend

# Pengaturan Produksi
pyramid.reload_templates = false
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en

# Hanya menyertakan CORS, menghapus debugtoolbar
pyramid.includes =
    pyramid_retry
    pyramid_default_cors

# Database URL diambil dari Environment Variable Railway
sqlalchemy.url = %(DATABASE_URL)s

# Konfigurasi CORS (Ganti localhost jika frontend sudah dideploy)
cors.allow_origin = http://localhost:5173
cors.allow_methods = GET,POST,PUT,DELETE,OPTIONS
cors.allow_headers = Authorization,Content-Type
cors.expose_headers = Authorization
cors.allow_credentials = true

retry.attempts = 3

[pshell]
setup = backend.pshell.setup

[alembic]
# Path menuju folder migrasi Anda
script_location = backend/alembic
# Agar alembic bisa membaca database dari variabel Railway
sqlalchemy.url = %(DATABASE_URL)s

[server:main]
use = egg:waitress#main
# Menggunakan variabel PORT agar Railway bisa mengatur koneksinya
listen = 0.0.0.0:%(PORT)s

###
# logging configuration
###

[loggers]
keys = root, backend, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_backend]
level = INFO
handlers =
qualname = backend

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s